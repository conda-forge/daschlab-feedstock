schema_version: 1

context:
  name: daschlab
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/daschlab-${{ version }}.tar.gz
  sha256: 1e0649db12171cf22fc3c80b5ed9b2c7de278c0a7c23e0630258af4d391e4ffa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - astropy-base >=6
    - bokeh >=3.1
    - dataclasses-json >=0.6
    - ipykernel >=6,<7 # workaround for pywwt/JupyterLab integration
    - numpy >=1.20
    - pandas >=1.2
    - pillow >=10
    - pycairo >=1.20
    - pytz >=2024
    - pywwt >=0.25
    - requests >=2
    - scipy >=1.10
    - toasty >=0.20
    - tqdm >=4.60

tests:
  - python:
      imports:
        - daschlab
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: DASCH data analysis package
  description: |
    daschlab is a Python package supporting scientific analysis of data from
    DASCH, the project to digitize the astronomical photographic glass plates of
    the Harvard College Observatory Plate Stacks collection.
  license: MIT
  license_file: LICENSE
  homepage: https://daschlab.readthedocs.io/
  documentation: https://daschlab.readthedocs.io/
  repository: https://github.com/pkgw/daschlab/

extra:
  recipe-maintainers:
    - pkgw
