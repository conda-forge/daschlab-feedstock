{% set name = "daschlab" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/daschlab-{{ version }}.tar.gz
  sha256: 1e0649db12171cf22fc3c80b5ed9b2c7de278c0a7c23e0630258af4d391e4ffa

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - astropy-base >=6
    - bokeh >=3.1
    - dataclasses-json >=0.6
    - ipykernel >=6
    - numpy >=1.20
    - pillow >=10
    - pycairo >=1.20
    - pytz >=2024
    - pywwt >=0.25
    - requests >=2
    - scipy >=1.10
    - toasty >=0.20
    - tqdm >=4.60

test:
  imports:
    - daschlab
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pkgw/daschlab
  summary: DASCH data analysis
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pkgw
